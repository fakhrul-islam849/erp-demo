{% extends 'base.html' %}

{% block content %}
<div class="card">
  <div class="card-body">
    <h4 class="card-title">
      {% if employee %}Update General Information{% else %}Add Information{% endif %}
    </h4>
    <form method="post" class="forms-sample" enctype="multipart/form-data" novalidate>
      {% csrf_token %}
      {% for field in form %}
        <div class="form-group">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <div class="text-danger small">{{ field.errors|join:', ' }}</div>
          {% endif %}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary me-2">Save</button>
      <a href="{% url 'employees:list' %}" class="btn btn-light">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
