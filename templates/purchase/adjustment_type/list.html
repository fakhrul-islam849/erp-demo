{% extends 'base.html' %}

{% block extra_css %}
{% include 'partials/datatable_css.html' %}
{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="card-title mb-0">Adjustment Types</h4>
      <a href="{% url 'purchase:adjustment_type_add' %}" class="btn btn-primary">
        <i class="mdi mdi-plus"></i> Add Adjustment Type
      </a>
    </div>
    <div class="table-responsive">
      <table id="adjustment-type-listing" class="table app-datatable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Type</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
{% include 'partials/datatable_js.html' %}
<script>
  $(function () {
    initServerDatatable('#adjustment-type-listing', {
      ajax: '{% url "purchase:adjustment_type_datatable" %}',
      order: [],
      columns: [
        { data: 'name' },
        { data: 'type' },
        { data: 'actions', orderable: false, searchable: false },
      ],
    });
  });
</script>
{% endblock %}
